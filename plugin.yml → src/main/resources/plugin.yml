name: EchoesPlugin
version: 1.1
main: com.echoes.EchoesPlugin
api-version: 1.16
commands:
  bindoath:
    description: Bind an oath with another player
    usage: /bindoath <player>
  breakoath:
    description: Break an existing oath
    usage: /breakoath <player>
  foundempire:
    description: Found a new empire
    usage: /foundempire <name>
